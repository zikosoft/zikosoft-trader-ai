# ZikosoftTrader AI — orchestration Docker Compose (B02)

name: zikosoft-trader-ai

networks:
  zikosoft-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  loki-data:
  prometheus-data:



services:
  # ---------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zikosofttrader}
      POSTGRES_USER: ${POSTGRES_USER:-zikosofttrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zikosofttrader} -d ${POSTGRES_DB:-zikosofttrader}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [zikosoft-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [zikosoft-net]
    restart: unless-stopped


  # ---------------------------------------------------------------------
  # API / frontend
  # ---------------------------------------------------------------------
  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zikosofttrader:change-me-local-only@postgres:5432/zikosofttrader}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [zikosoft-net]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      - backend-api
    healthcheck:
      # node:20-slim n'embarque ni curl ni wget — `fetch` global de Node 20
      # suffit, sans dépendance supplémentaire dans l'image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [zikosoft-net]
    restart: unless-stopped

